name: CI

# Test pyramid:
#   check      — typecheck (host + client + mirror check) and the
#                unit/composition/real-persistence suites. Fast; every push
#                and pull request.
#   e2e-pinned — the hermetic two-instance A2A smoke against the pinned harness
#                version. Every push and pull request.
#   e2e-matrix — the same smoke against every harness version the peer ranges
#                claim. Nightly and manual dispatch, so a release cannot ship
#                against an untested harness line.
#
# The sibling-harness layout is mandatory: the plugin's typecheck and tests
# resolve @deepseek-ai/* through tsconfig paths and project references into
# `../deepseek-harness`, never through node_modules.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full matrix: catch harness drift before a release, not after.
    - cron: '0 3 * * *'

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.28.5'
  HARNESS_REPO: deepseek-ai/deepseek-harness
  # The harness version every push/PR is verified against. Keep this in sync
  # with a matrix entry below and with the compatibility record.
  PINNED_HARNESS: dsh-v0.2.1-rc.3

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out harness
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPO }}
          ref: ${{ env.PINNED_HARNESS }}
          path: deepseek-harness
          fetch-depth: 1

      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: dsh-a2a

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            deepseek-harness/pnpm-lock.yaml
            dsh-a2a/pnpm-lock.yaml

      - name: Install harness workspace
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      # The plugin's client typecheck reads the harness client packages'
      # built declarations (`ui-renderer`, `ui-slots`, `ui-settings`), and the
      # real-persistence suite loads the JSONL backend's native addon. A
      # source-only checkout fails with TS6305 before any test runs.
      - name: Build harness artifacts
        working-directory: deepseek-harness
        run: pnpm run build

      - name: Install plugin workspace
        working-directory: dsh-a2a
        run: pnpm install --frozen-lockfile

      - name: Typecheck (host + client + mirror check)
        working-directory: dsh-a2a
        run: pnpm typecheck

      - name: Unit, composition, and real-persistence tests
        working-directory: dsh-a2a
        run: pnpm test

  e2e-pinned:
    name: e2e (pinned)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/e2e.yml
    with:
      harness: dsh-v0.2.1-rc.3

  e2e-matrix:
    name: e2e (${{ matrix.harness }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        harness:
          - dsh-v0.2.1-rc.3
          - dsh-v0.2.1-rc.2
          - dsh-v0.2.1-alpha.2
          - dsh-v0.1.7-rc.2
    uses: ./.github/workflows/e2e.yml
    with:
      harness: ${{ matrix.harness }}
