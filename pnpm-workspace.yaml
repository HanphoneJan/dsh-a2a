# Standalone workspace for the @hanphone/dsh-a2a plugin. Deliberately NOT a
# member of the harness workspace: this package manages its own dependency
# graph (zod + tooling) and only type-checks against the harness checkout via
# tsconfig paths. @deepseek-ai/* stay peer dependencies, provided at runtime
# by the DSH composition that loads the plugin.
packages:
  - "."

# The harness-provided @deepseek-ai/* peers have no registry version inside
# their truthful ranges, so pnpm must neither auto-install them nor reify the
# dependency tree before a script run.
autoInstallPeers: false
verifyDepsBeforeRun: false
