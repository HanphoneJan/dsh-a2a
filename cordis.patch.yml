# @hanphone/dsh-a2a bundle patch: mount the plugin as one row, enabled by
# default (install-and-use; turn either half off through the GUI dashboard or
# an overlay patch on this row).
- insert:
    - id: a2a
      name: '@hanphone/dsh-a2a'
      config:
        server:
          enabled: true
        client:
          agents: []